version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ziru-postgres
    environment:
      POSTGRES_DB: ziru_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ziru-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:localdev@postgres:5432/ziru_assistant
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY}
      AMAP_API_KEY: ${AMAP_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
